<title>Calendário WFIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: grade semanal canal x dia, igual ao planejador do time; leitura e apresentação, sem edição */
  :root{
    --bg:#f7f7f5; --surface:#ffffff; --surface-2:#fbfbfa;
    --border:#e3e2de; --border-strong:#d0cfc9;
    --text:#1c1b19; --text-2:#6b6963; --text-3:#9a978f;
    --accent:#1c1b19; --on-accent:#f7f7f5; --focus:#2563eb;

    --st-postado:#8a8781; --st-agendado:#1b7f4d; --st-pronto:#2563eb;
    --st-prod:#d9640c; --st-ref:#be3a8a; --st-ideia:#c2860a; --st-definir:#b9b6ae;

    --g-escrita:#2b6cb0; --g-youtube:#c4302b;

    --f-captacao:#0f766e; --f-captacao-bg:#e6f4f2;
    --f-evento:#7c3aed;   --f-evento-bg:#f1ebfe;
    --f-carrinho:#dc2626; --f-carrinho-bg:#fdeaea;
    --f-feriado:#8a8781;  --f-feriado-bg:#f0efec;
    --f-reality:#c2860a;  --f-reality-bg:#fdf6e6;

    --shadow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.28);
    --radius:9px; --label-w:118px; --cell-h:78px;
    --font:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141413; --surface:#1c1b1a; --surface-2:#211f1e;
      --border:#2f2d2b; --border-strong:#413e3b;
      --text:#eceae6; --text-2:#a3a09a; --text-3:#75726d;
      --accent:#eceae6; --on-accent:#141413; --focus:#6f9cf5;
      --st-postado:#96938d; --st-agendado:#4cc389; --st-pronto:#7aa5f7;
      --st-prod:#f59e4a; --st-ref:#e879b8; --st-ideia:#e0a92e; --st-definir:#55524d;
      --g-escrita:#7aa5f7; --g-youtube:#f07a75;
      --f-captacao:#2dd4bf; --f-captacao-bg:#0e2e2b;
      --f-evento:#a78bfa;   --f-evento-bg:#241a3d;
      --f-carrinho:#f87171; --f-carrinho-bg:#341617;
      --f-feriado:#96938d;  --f-feriado-bg:#282725;
      --f-reality:#e0a92e;  --f-reality-bg:#33280f;
      --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141413; --surface:#1c1b1a; --surface-2:#211f1e;
    --border:#2f2d2b; --border-strong:#413e3b;
    --text:#eceae6; --text-2:#a3a09a; --text-3:#75726d;
    --accent:#eceae6; --on-accent:#141413; --focus:#6f9cf5;
    --st-postado:#96938d; --st-agendado:#4cc389; --st-pronto:#7aa5f7;
    --st-prod:#f59e4a; --st-ref:#e879b8; --st-ideia:#e0a92e; --st-definir:#55524d;
    --g-escrita:#7aa5f7; --g-youtube:#f07a75;
    --f-captacao:#2dd4bf; --f-captacao-bg:#0e2e2b;
    --f-evento:#a78bfa;   --f-evento-bg:#241a3d;
    --f-carrinho:#f87171; --f-carrinho-bg:#341617;
    --f-feriado:#96938d;  --f-feriado-bg:#282725;
    --f-reality:#e0a92e;  --f-reality-bg:#33280f;
    --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 var(--font); -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--focus)}

  /* ---------- cabeçalho ---------- */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border);
    padding-block:12px 10px;
    padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px));
  }
  .titulo{text-align:center;margin-bottom:10px}
  .titulo h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
  .titulo p{margin:1px 0 0;font-size:12px;color:var(--text-3)}
  .head-row{display:flex;justify-content:center}
  .wtabs{
    position:relative;display:flex;padding:4px;max-width:100%;overflow-x:auto;
    background:var(--surface-2);border:1px solid var(--border);border-radius:13px;
  }
  .wtab{
    position:relative;border:none;background:none;border-radius:10px;
    padding:8px 16px;min-width:124px;font-size:15px;font-weight:600;letter-spacing:-.01em;
    color:var(--text-3);white-space:nowrap;line-height:1.2;transition:color .2s,background .2s,box-shadow .2s;
  }
  .wtab:hover{color:var(--text-2)}
  .wtab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .wtab[aria-selected="true"]{color:var(--text);background:var(--surface);box-shadow:0 1px 3px var(--shadow),0 0 0 1px var(--border)}
  .wtab small{display:block;font-size:11px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:0}
  .wtab .fase{display:block;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:3px;opacity:.6}
  .wtab[aria-selected="true"] .fase{opacity:1}

  .meta-row{display:flex;justify-content:center;align-items:center;gap:8px 15px;margin-top:9px;flex-wrap:wrap}
  .legend-fases{display:flex;gap:11px;font-size:12px;color:var(--text-2);flex-wrap:wrap;align-items:center;padding-right:15px;border-right:1px solid var(--border)}
  .legend-fases b{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
  .legend-fases span{font-weight:600}
  .legend{display:flex;gap:11px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
  .legend b{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px;vertical-align:1px}
  .resumo-geral{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}

  .fase-captacao{color:var(--f-captacao)} .fase-evento{color:var(--f-evento)} .fase-carrinho{color:var(--f-carrinho)}
  .fb-captacao{background:var(--f-captacao)} .fb-evento{background:var(--f-evento)} .fb-carrinho{background:var(--f-carrinho)}
  .tag-fase{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .tag-fase.captacao{color:var(--f-captacao);background:var(--f-captacao-bg)}
  .tag-fase.evento{color:var(--f-evento);background:var(--f-evento-bg)}
  .tag-fase.carrinho{color:var(--f-carrinho);background:var(--f-carrinho-bg)}

  /* status */
  .d-postado{background:var(--st-postado)} .d-agendado{background:var(--st-agendado)}
  .d-pronto{background:var(--st-pronto)} .d-prod{background:var(--st-prod)}
  .d-ref{background:var(--st-ref)} .d-ideia{background:var(--st-ideia)}
  .d-definir{background:transparent;box-shadow:inset 0 0 0 1.5px var(--st-definir)}
  .s-postado{color:var(--st-postado)} .s-agendado{color:var(--st-agendado)} .s-pronto{color:var(--st-pronto)}
  .s-prod{color:var(--st-prod)} .s-ref{color:var(--st-ref)} .s-ideia{color:var(--st-ideia)} .s-definir{color:var(--text-3)}

  /* ---------- corpo ---------- */
  main{
    padding-block:14px 30px;
    padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px));
    max-width:1700px;margin:0 auto;
  }
  .view[hidden]{display:none}
  .week-head{display:flex;align-items:baseline;gap:9px;padding:0 0 6px 2px;flex-wrap:wrap}
  .week-head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
  .week-head small{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .week-head .rule{flex:1;height:1px;background:var(--border);align-self:center;min-width:20px}
  .scroller{overflow-x:auto;padding-bottom:4px}
  .grid{display:grid;grid-template-columns:var(--label-w) repeat(7,minmax(0,1fr)) minmax(0,.85fr);gap:5px;min-width:960px}

  .dayhead{text-align:center;padding:1px 4px 4px;font-size:10.5px;line-height:1.3;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
  .dayhead strong{display:block;font-size:13px;color:var(--text-2);letter-spacing:-.01em;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
  .dayhead.today strong{color:var(--focus)}
  .dayhead.fora{opacity:.4}
  .dayhead .faixa{display:flex;gap:2px;height:2px;margin-top:4px}
  .dayhead .faixa i{flex:1;border-radius:2px}
  .marcos{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px;min-height:15px}
  .marco{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;white-space:nowrap}
  .marco.evento{color:var(--f-evento);background:var(--f-evento-bg)}
  .marco.reality{color:var(--f-reality);background:var(--f-reality-bg)}
  .marco.feriado{color:var(--f-feriado);background:var(--f-feriado-bg)}
  .marco.carrinho{color:var(--f-carrinho);background:var(--f-carrinho-bg)}
  .dayhead.semdia{display:flex;flex-direction:column;justify-content:flex-start}
  .dayhead.semdia strong{font-size:12px;color:var(--text-3)}

  .group-head{
    grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin-top:8px;padding:6px 2px 4px;border-top:1px solid var(--border);
  }
  .group-head .nome{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .group-head[data-g="escrita"] .nome{color:var(--g-escrita)}
  .group-head[data-g="youtube"] .nome{color:var(--g-youtube)}
  .group-head .nota{font-size:11.5px;color:var(--text-3)}
  .group-head .resumo{font-size:11px;color:var(--text-3);margin-left:auto;font-variant-numeric:tabular-nums}

  .rowlabel{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-right:9px}
  .rowlabel span{font-size:12.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .rowlabel small{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

  .cell{
    min-height:var(--cell-h);padding:3px;border-radius:var(--radius);
    background:transparent;border:1px dashed var(--border);
    display:flex;flex-direction:column;gap:3px;
  }
  .cell.fora,.cell.feriado{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--border) 45%,transparent) 6px 7px)}
  .cell.filled{border-color:transparent;padding:0}
  .post{
    display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:6px 8px 7px;box-shadow:0 1px 2px var(--shadow);
    transition:border-color .12s,transform .12s;flex:1;
  }
  .post:hover{border-color:var(--text-3);transform:translateY(-1px)}
  .post:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .post.active{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
  .post.vazio{background:var(--surface-2);box-shadow:none;border-style:dashed}
  .post .linha{display:flex;align-items:flex-start;gap:5px;font-size:11.8px;line-height:1.3}
  .post .dot{width:7px;height:7px;border-radius:99px;flex-shrink:0;margin-top:4px}
  .post .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1;min-width:0}
  .post.vazio .txt{color:var(--text-3);font-style:italic}
  .post .meta{font-size:10px;color:var(--text-3);padding-left:12px;display:flex;gap:6px;flex-wrap:wrap}
  .post .meta .cta{color:var(--text-2);font-weight:600}
  .post .ic{font-size:10px;color:var(--text-3);flex-shrink:0}

  /* ---------- visão geral ---------- */
  .ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0}
  .card.largo{grid-column:1 / -1}
  .card h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
  .card p{margin:0 0 8px;font-size:14px;color:var(--text-2);max-width:65ch}
  .card p:last-child{margin-bottom:0}
  .card strong{color:var(--text)}
  .lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .lista li{font-size:13.5px;color:var(--text-2);line-height:1.45}
  .lista li b{color:var(--text);font-weight:600;display:block;font-size:13.5px}
  .timeline{display:flex;flex-direction:column;gap:8px}
  .tl{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;font-size:13.5px}
  .tl .quando{font-variant-numeric:tabular-nums;color:var(--text-3);font-size:12.5px}
  .tl .oque{color:var(--text-2)}
  .tl .oque b{color:var(--text);font-weight:600}
  .tabela-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
  td:first-child{font-weight:600;white-space:nowrap}
  td{color:var(--text-2);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td em{color:var(--text-3)}

  /* ---------- painel ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{
    position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;z-index:50;
    background:var(--surface);border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-right:env(safe-area-inset-right,0px);
  }
  aside.open{transform:none}
  .panel-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
  .panel-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .panel-head h2{margin:2px 0 0;font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
  .panel-head p{margin:3px 0 0;font-size:12.5px;color:var(--text-2)}
  .icon-btn{width:28px;height:28px;flex-shrink:0;margin-left:auto;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--text-2);line-height:1}
  .icon-btn:hover{border-color:var(--border-strong);color:var(--text)}
  .panel-nav{display:flex;gap:6px;padding:9px 18px;border-bottom:1px solid var(--border)}
  .panel-nav button{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:12.5px;color:var(--text-2)}
  .panel-nav button:hover:not(:disabled){border-color:var(--border-strong);color:var(--text)}
  .panel-nav button:disabled{opacity:.4;cursor:default}
  .panel-nav span{margin-left:auto;font-size:12px;color:var(--text-3);align-self:center;font-variant-numeric:tabular-nums}
  .panel-body{padding:16px 18px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
  .fichas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
  .ficha label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
  .ficha div{font-size:13.5px;color:var(--text)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
  .pill .dot{width:8px;height:8px;border-radius:99px}
  .bloco label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
  .links{display:flex;flex-direction:column;gap:5px}
  .links a{font-size:13.5px;text-decoration:none;overflow-wrap:anywhere}
  .links a:hover{text-decoration:underline}
  .obs{font-size:13.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  .texto{font-size:14px;line-height:1.6;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .texto p{margin:0 0 10px}
  .texto p:last-child{margin-bottom:0}
  .copiar{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--text-2);float:right;margin-top:-3px}
  .copiar:hover{border-color:var(--border-strong);color:var(--text)}
  .sem-texto{font-size:13px;color:var(--text-3);font-style:italic}

  /* tags do card */
  .tags{display:flex;flex-wrap:wrap;gap:3px;padding-left:12px;margin-top:1px}
  .tg{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;line-height:1.55;white-space:nowrap}
  .tg.f-topo,.tg.f-meio,.tg.f-fundo{text-transform:uppercase;letter-spacing:.07em}
  .tg.f-topo{color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
  .tg.f-meio{color:var(--text);background:color-mix(in srgb,var(--text) 15%,transparent)}
  .tg.f-fundo{color:var(--on-accent);background:var(--accent)}
  .tg.cta{color:var(--focus);background:color-mix(in srgb,var(--focus) 13%,transparent)}
  .tg.pe{color:var(--text-2);font-weight:600;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
  .legend-funil{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text-2);padding-right:15px;border-right:1px solid var(--border)}
  .legend-funil .tg{font-size:9px}

  /* post simulado */
  .mock{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:0 1px 3px var(--shadow)}
  .mock-head{display:flex;gap:10px;align-items:center;padding:12px 14px 0}
  .av{width:38px;height:38px;flex-shrink:0;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--g-escrita);background:color-mix(in srgb,var(--g-escrita) 18%,var(--surface-2))}
  .mock-nome{font-size:13.5px;font-weight:650;line-height:1.25}
  .mock-sub{font-size:11.5px;color:var(--text-3)}
  .mock-corpo{padding:10px 14px 12px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
  .mock-corpo p{margin:0 0 10px}
  .mock-corpo p:last-child{margin-bottom:0}
  .mock-corpo.cortado{max-height:7.2em;overflow:hidden;padding-bottom:0;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
  .ver-mais{display:block;margin:2px 14px 10px auto;border:none;background:none;padding:0;font-size:13px;font-weight:600;color:var(--text-2)}
  .ver-mais:hover{color:var(--text);text-decoration:underline}
  .mock-acoes{display:flex;justify-content:space-around;border-top:1px solid var(--border);padding:9px 8px;font-size:12.5px;color:var(--text-2);font-weight:600}
  .th-item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:12px 14px 0}
  .th-col{display:flex;flex-direction:column;align-items:center}
  .th-col i{flex:1;width:2px;background:var(--border-strong);margin-top:6px;min-height:14px;border-radius:2px}
  .th-item:last-child .th-col i{display:none}
  .th-item .mock-corpo{padding:2px 0 0}
  .th-acoes{font-size:13px;color:var(--text-3);display:flex;gap:18px;padding:8px 0 12px}
  .bloco-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .bloco-head label{margin:0}

  @media (max-width:1100px){

    const av = `<div class="av" aria-hidden="true"></div>`;
    if (p.c === 'threads') {
      const partes = p.texto.split(/(?=\*\*\d+\/\d+\*\*)/).map(s => s.trim()).filter(Boolean);
      return `<div class="mock" id="textoPost">` + partes.map((parte, i) =>
        `<div class="th-item"><div class="th-col">${av}<i></i></div><div>` +
        `<div class="mock-nome">Perfil da marca <span class="mock-sub">· ${i === 0 ? 'agora' : 'fio'}</span></div>` +
        `<div class="mock-corpo">${textoHTML(parte)}</div>` +
        `<div class="th-acoes" aria-hidden="true"><span>♡</span><span>○</span><span>↻</span><span>➤</span></div></div></div>`).join('') + `</div>`;
    }
    const longo = p.texto.length > 260;
    return `<div class="mock" id="textoPost"><div class="mock-head">${av}<div><div class="mock-nome">Perfil da marca</div><div class="mock-sub">Agora · público</div></div></div>` +
      `<div class="mock-corpo${longo ? ' cortado' : ''}">${textoHTML(p.texto)}</div>` +
      (longo ? `<button type="button" class="ver-mais" id="verMais">…ver mais</button>` : '') +
      `<div class="mock-acoes" aria-hidden="true"><span>Gostei</span><span>Comentar</span><span>Compartilhar</span><span>Enviar</span></div></div>`;
  }

  function abrir(i){
    atual = i;
    const p = P[i];
    const c = canal(p.c);
    const g = GRUPOS.find(x => x.id === c.grupo);
    const stNome = p.status || 'A definir';
    const quando = p.d ? `${WDL[parse(p.d).getDay()]}, ${dm(p.d)}` : `${SEMANAS[p.w].nome}, dia a definir`;

    $('#pEyebrow').textContent = `${g.id === 'youtube' ? 'YouTube · ' : ''}${c.nome}`;
    $('#pEyebrow').style.color = `var(--g-${g.id})`;
    $('#pTitle').textContent = p.ideia || (p.links?.length ? 'Post a partir de referência' : 'Tema a definir');
    $('#pSub').textContent = `${quando} · ${p.fase}`;

    const fichas = [
      ['Status', `<span class="pill s-${p.st}"><span class="dot d-${p.st}"></span>${esc(stNome)}</span>`],
      ['Persona', esc(p.persona || 'A definir')],
      ['Funil', esc(p.funil || 'A definir')],
      ['CTA', esc(p.cta || (p.tipo ? (p.tipo === 'Com CTA' ? 'Sim' : 'Não') : 'Não informado'))],
    ];
    if (p.tipo) fichas.push(['Tipo', esc(p.tipo)]);
    if (p.objetivo) fichas.push(['Objetivo', esc(p.objetivo)]);
    if (p.formato) fichas.push(['Formato', esc(p.formato)]);

    let b = `<div class="fichas">${fichas.map(([l,v]) => `<div class="ficha"><label>${l}</label><div>${v}</div></div>`).join('')}</div>`;
    if (p.links?.length) b += `<div class="bloco"><label>Links</label><div class="links">${p.links.map(([n,u]) =>
      `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a>`).join('')}</div></div>`;
    if (p.obs) b += `<div class="bloco"><label>Observação</label><div class="obs">${esc(p.obs)}</div></div>`;
    if (p.texto) {
      b += `<div class="bloco"><div class="bloco-head"><label>Prévia do post</label><button type="button" class="copiar" id="copiar">Copiar texto</button></div>${previa(p)}</div>`;
    } else {
      const noLink = p.links?.some(([n]) => /texto/i.test(n));
      b += `<div class="bloco"><label>Prévia do post</label><div class="sem-texto">${noLink ? 'O texto está no documento do link acima.' : 'Texto ainda não escrito no planejamento.'}</div></div>`;
    }
    $('#pBody').innerHTML = b;
    $('#pBody').scrollTop = 0;

    const pos = ORDEM.findIndex(x => x.i === i);
    $('#prevPost').disabled = pos <= 0;
    $('#nextPost').disabled = pos >= ORDEM.length - 1;
    $('#pPos').textContent = `${pos+1} de ${ORDEM.length}`;

    // a semana do post precisa estar visível
    const v = `semana-${p.w+1}`;
    if (view !== v) { view = v; history.replaceState(null,'',`#${v}`); mostrarView(); }
    document.querySelectorAll('.post.active').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.post[data-i="${i}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest',inline:'nearest'}); }

    panel.classList.add('open'); scrim.classList.add('open');
    panel.removeAttribute('inert'); panel.setAttribute('aria-hidden','false');
  }
  function fechar(){
    panel.classList.remove('open'); scrim.classList.remove('open');
    panel.setAttribute('inert',''); panel.setAttribute('aria-hidden','true');
    const el = document.querySelector(`.post[data-i="${atual}"]`);
    document.querySelectorAll('.post.active').forEach(x => x.classList.remove('active'));
    atual = null;
    if (el) el.focus();
  }
  function passo(n){
    if (atual === null) return;
    const pos = ORDEM.findIndex(x => x.i === atual);
    const prox = ORDEM[pos + n];
    if (prox) abrir(prox.i);
  }

  // ---------- eventos ----------
  $('#wtabs').addEventListener('click', e => {
    const t = e.target.closest('.wtab'); if (!t) return;
    view = t.dataset.v; history.replaceState(null,'',`#${view}`);
    if (atual !== null) fechar();
    mostrarView();
  });
  $('#main').addEventListener('click', e => {
    const b = e.target.closest('.post'); if (b) abrir(Number(b.dataset.i));
  });
  $('#pBody').addEventListener('click', e => {
    if (e.target.id === 'verMais') {
      document.querySelector('#textoPost .mock-corpo')?.classList.remove('cortado');
      e.target.remove();
      return;
    }
    if (e.target.id !== 'copiar' || atual === null) return;
    const btn = e.target, txt = textoPlano(P[atual].texto || '');
    const ok = () => { btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = 'Copiar texto'; }, 1400); };
    try {
      navigator.clipboard.writeText(txt).then(ok).catch(() => selecionar());
    } catch(_) { selecionar(); }
    function selecionar(){
      const r = document.createRange(); r.selectNodeContents($('#textoPost'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'Texto selecionado';
    }
  });
  $('#closePanel').addEventListener('click', fechar);
  scrim.addEventListener('click', fechar);
  $('#prevPost').addEventListener('click', () => passo(-1));
  $('#nextPost').addEventListener('click', () => passo(1));
  document.addEventListener('keydown', e => {
    if (atual === null) return;
    if (e.key === 'Escape') fechar();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { if (!e.target.closest('input,textarea')) { e.preventDefault(); passo(1); } }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (!e.target.closest('input,textarea')) { e.preventDefault(); passo(-1); } }
  });
  window.addEventListener('hashchange', () => { lerHash(); mostrarView(); });

  lerHash();
  renderLegendas();
  render();
})();
</script>
