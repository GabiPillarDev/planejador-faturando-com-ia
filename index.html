<meta charset="utf-8">

<title>Dashboard IFA 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body style="margin:0">

<style id="gate-style">
:root{--g-bg:#f3f7fb;--g-card:#ffffff;--g-line:#e2eaf3;--g-ink:#0b1526;--g-muted:#5a6a7f;--g-accent:#119ff5;--g-err:#c2410c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-bg:#08101b;--g-card:#0f1a29;--g-line:#1f2d41;--g-ink:#eaf2fb;--g-muted:#93a4ba;--g-accent:#3bb4ff;--g-err:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--g-bg:#08101b;--g-card:#0f1a29;--g-line:#1f2d41;--g-ink:#eaf2fb;--g-muted:#93a4ba;--g-accent:#3bb4ff;--g-err:#fb923c;color-scheme:dark}
body{background:var(--g-bg);color:var(--g-ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
#gate{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px;box-sizing:border-box}
#gate form{width:100%;max-width:380px;background:var(--g-card);border:1px solid var(--g-line);border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(13,26,46,.06);display:grid;gap:14px;box-sizing:border-box}
#gate .brand{font-family:"Inter Tight","Inter",system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
#gate .brand i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--g-ink);color:var(--g-card);font-style:normal;font-size:14px}
#gate h1{font-family:"Inter Tight","Inter",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1.1;margin:6px 0 0}
#gate p{margin:0;color:var(--g-muted);font-size:14px;line-height:1.5}
#gate label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--g-muted)}
#gate input{font:500 16px "Inter",system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-bg);color:var(--g-ink);width:100%;box-sizing:border-box}
#gate input:focus-visible,#gate button:focus-visible{outline:2px solid var(--g-accent);outline-offset:2px}
#gate button{font:600 15px "Inter",system-ui,sans-serif;padding:12px 16px;border-radius:999px;border:0;background:var(--g-accent);color:#fff;cursor:pointer}
#gate button[disabled]{opacity:.6;cursor:wait}
#gate .err{color:var(--g-err);font-size:13.5px;font-weight:600;min-height:1.2em}
</style>
<div id="gate">
  <form id="gate-form" autocomplete="off">
    <div class="brand"><i>↗</i>subido</div>
    <h1>Dashboard IFA 2.0</h1>
    <p>Conteúdo protegido. Digite a senha para abrir.</p>
    <label for="gate-pwd">Senha</label>
    <input id="gate-pwd" type="password" autocomplete="current-password" required autofocus>
    <button id="gate-btn" type="submit">Abrir dashboard</button>
    <div class="err" id="gate-err" role="alert"></div>
  </form>
</div>

<script>
(function(){
  const B=JSON.parse(document.getElementById('gate-data').textContent);
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const form=document.getElementById('gate-form'),btn=document.getElementById('gate-btn'),err=document.getElementById('gate-err'),inp=document.getElementById('gate-pwd');
  async function open(pwd){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,b64(B.c));
    return new TextDecoder().decode(plain);
  }
  function mount(html){
    document.getElementById('gate').remove();document.getElementById('gate-style').remove();
    const app=document.getElementById('app');app.innerHTML=html;
    app.querySelectorAll('script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);});
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Abrindo...';
    try{const html=await open(inp.value);try{sessionStorage.setItem('ifa2-k',inp.value);}catch(_){} mount(html);}
    catch(_){err.textContent='Senha incorreta. Confira e tente de novo.';btn.disabled=false;btn.textContent='Abrir dashboard';inp.select();}
  });
  try{const k=sessionStorage.getItem('ifa2-k');if(k){open(k).then(mount).catch(()=>{try{sessionStorage.removeItem('ifa2-k')}catch(_){}});}}catch(_){}
})();
</script>
